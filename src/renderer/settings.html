<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title></title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div class="header">
    <div class="logo">📷</div>
    <div class="header-title">
      <h1 data-i18n="settings.header.title"></h1>
      <p data-i18n="settings.header.subtitle"></p>
    </div>
    <div class="zoom-ctrl">
      <button class="zoom-btn" id="zoom-out" data-i18n-title="settings.zoom.out">−</button>
      <span class="zoom-val" id="zoom-val">100%</span>
      <button class="zoom-btn" id="zoom-in" data-i18n-title="settings.zoom.in">＋</button>
      <button class="zoom-btn zoom-reset" id="zoom-reset" data-i18n="settings.zoom.reset" data-i18n-title="settings.zoom.resetTitle"></button>
    </div>
  </div>

  <div class="scroll">
    <!-- 语言：放在最上面，方便第一时间找到 -->
    <div class="card">
      <div class="card-title" data-i18n="settings.card.language"></div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.language.label"></div>
          <div class="desc" data-i18n="settings.language.desc"></div>
        </div>
        <div class="ctl">
          <select class="select" id="opt-language">
            <option value="auto" data-i18n="settings.language.auto"></option>
            <option value="zh" data-i18n="settings.language.zh"></option>
            <option value="en" data-i18n="settings.language.en"></option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="settings.card.hotkey"></div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.hotkey.label"></div>
          <div class="desc" data-i18n="settings.hotkey.desc"></div>
        </div>
        <div class="ctl">
          <div class="hotkey-box" id="hotkey-box" tabindex="0" role="button" data-i18n-title="settings.hotkey.boxTitle">
            <span id="hotkey-text"></span>
          </div>
          <button class="btn-link" id="hotkey-reset" data-i18n="settings.hotkey.reset" data-i18n-title="settings.hotkey.resetTitle"></button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="settings.card.general"></div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.ocr.label"></div>
          <div class="desc" data-i18n="settings.ocr.desc"></div>
        </div>
        <div class="ctl">
          <select class="select" id="opt-ocr-profile">
            <option value="fast" data-i18n="settings.ocr.fast"></option>
            <option value="balanced" data-i18n="settings.ocr.balanced"></option>
            <option value="accurate" data-i18n="settings.ocr.accurate"></option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.autoLaunch.label"></div>
          <div class="desc" data-i18n="settings.autoLaunch.desc"></div>
        </div>
        <div class="ctl">
          <label class="switch">
            <input type="checkbox" id="opt-autolaunch">
            <span class="track"></span><span class="thumb"></span>
          </label>
        </div>
      </div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.captureLaunch.label"></div>
          <div class="desc" data-i18n="settings.captureLaunch.desc"></div>
        </div>
        <div class="ctl">
          <label class="switch">
            <input type="checkbox" id="opt-capture-launch">
            <span class="track"></span><span class="thumb"></span>
          </label>
        </div>
      </div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.autoClose.label"></div>
          <div class="desc" data-i18n="settings.autoClose.desc"></div>
        </div>
        <div class="ctl">
          <label class="switch">
            <input type="checkbox" id="opt-auto-close">
            <span class="track"></span><span class="thumb"></span>
          </label>
        </div>
      </div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.gpu.label"></div>
          <div class="desc" data-i18n="settings.gpu.desc"></div>
        </div>
        <div class="ctl">
          <label class="switch">
            <input type="checkbox" id="opt-gpu">
            <span class="track"></span><span class="thumb"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="settings.card.about"></div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.version.label"></div>
          <div class="desc" data-i18n="settings.version.desc"></div>
        </div>
        <div class="ctl">
          <span class="version-tag" id="app-version">v—</span>
          <button class="btn btn-sm" id="btn-check-update" data-i18n="settings.version.check"></button>
        </div>
      </div>
      <div class="row">
        <div class="meta">
          <div class="label" data-i18n="settings.autoCheck.label"></div>
          <div class="desc" data-i18n="settings.autoCheck.desc"></div>
        </div>
        <div class="ctl">
          <label class="switch">
            <input type="checkbox" id="opt-auto-check">
            <span class="track"></span><span class="thumb"></span>
          </label>
        </div>
      </div>
      <div class="update-status" id="update-status"></div>
    </div>
  </div>

  <div class="footer">
    <span class="hint" id="hint"></span>
    <button class="btn" id="btn-cancel" data-i18n="settings.cancel"></button>
    <button class="btn btn-primary" id="btn-save" data-i18n="settings.save"></button>
  </div>

  <script src="../shared/i18n.js"></script>
  <script src="accelerator.js"></script>
  <script src="settings.js"></script>
</body>
</html>
