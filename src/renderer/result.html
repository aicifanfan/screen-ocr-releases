<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title></title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/result.css">
</head>
<body>
  <div class="toolbar" role="toolbar">
    <button id="btn-copy-all" class="btn btn-sm btn-primary" data-i18n="result.copyAll"></button>
    <button id="btn-copy-sel" class="btn btn-sm" data-i18n="result.copySel" disabled></button>
    <label><input type="checkbox" id="toggle-boxes" checked> <span data-i18n="result.showBoxes"></span></label>
    <label data-i18n-title="result.autoCloseTitle"><input type="checkbox" id="auto-close" checked> <span data-i18n="result.autoClose"></span></label>
    <span id="status" class="pill" role="status" aria-live="polite"></span>
    <span id="refining" class="pill pill-refining" role="status" aria-live="polite" hidden data-i18n="result.refining"></span>
    <button id="btn-settings" class="btn btn-sm btn-ghost" data-i18n="result.settings" data-i18n-title="result.settingsTitle"></button>
  </div>
  <div class="main" id="main" aria-busy="false"></div>
  <script src="../shared/i18n.js"></script>
  <script src="result.js"></script>
</body>
</html>
