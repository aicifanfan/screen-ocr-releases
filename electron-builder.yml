appId: com.example.screenocr
productName: 截屏OCR
directories:
  output: dist
files:
  - src/**/*
  - package.json
extraResources:
  - from: python/ocr_pkg/ocr_server
    to: ocr_server
publish:
  provider: github
  owner: aicifanfan
  repo: screen-ocr-releases
  releaseType: release
win:
  # 同时产出：
  #   nsis → 带「创建桌面快捷方式」选项的安装包（自动更新使用这个）
  #   zip  → 免安装压缩包，解压即用，方便分享
  target:
    - nsis
    - zip
  icon: assets/icon.ico
nsis:
  # 安装包文件名必须与 latest.yml 里的 url 完全一致，否则自动更新在 GitHub 上找不到资产。
  # productName 是中文时，默认会写出「截屏OCR Setup 0.2.1.exe」，而清单里写的是
  # screen-ocr-setup-0.2.1.exe —— 两者不一致会让增量/全量更新都 404。
  artifactName: screen-ocr-setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 截屏OCR
  # 自定义安装脚本：在「选择安装位置」后插入「选择附加任务」页，
  # 提供「创建桌面快捷方式」复选框（默认勾选），取消勾选则不创建
  include: assets/installer.nsh
  deleteAppDataOnUninstall: false
